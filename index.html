<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wikipedia Mind Palace</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D mind palace room"></canvas>
  <div id="cand-labels" hidden></div>

  <header id="topbar" hidden></header>

  <section id="landing" hidden>
    <div class="board">
      <nav class="modes" aria-label="Mode">
        <a class="on" href="./" aria-current="page">Explore</a>
        <a href="?study" title="Timed session for the user study: sign in, read for 15 minutes, then the page closes">Study session</a>
      </nav>
      <div class="eyebrow">Wikipedia Mind Palace</div>
      <h1>Walk through what you read.</h1>
      <p class="lead">Turn a Wikipedia article into a room. Each section becomes an object you choose, placed along a path. Retrace the path later to remember it.</p>
      <form id="search-form" autocomplete="off">
        <label for="q">Enter or search for an article</label>
        <div class="search">
          <input id="q" type="text" placeholder="Honey bee, or a wikipedia.org/wiki/… link" spellcheck="false">
          <button type="submit" class="primary">Build palace</button>
        </div>
        <ul id="suggestions" hidden></ul>
      </form>
      <div id="access" hidden></div>
      <div id="ready" hidden>
        <div class="ready-label">Ready-made palaces <span>open instantly</span></div>
        <div id="ready-list"></div>
      </div>
      <div class="alt">
        <button id="resume" type="button" hidden>Resume</button>
        <button id="open-file" type="button">Open a palace file</button>
      </div>
      <p id="landing-error" class="error" hidden></p>
    </div>
  </section>

  <div id="loading" hidden><div class="spinner"></div><span id="loading-text"></span></div>
  <aside id="panel" hidden></aside>
  <div id="hint" hidden></div>
  <div id="toast" role="status" hidden></div>
  <main id="reader" hidden></main>
  <div id="study-overlay" hidden></div>
  <input id="file-input" type="file" accept=".json,application/json" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
